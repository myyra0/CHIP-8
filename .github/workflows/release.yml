name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - name: Check version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use x.x.x format, for example 1.2.3"
            exit 1
          fi

  package:
    name: Package (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            generator: TGZ
            artifact: linux
          - os: macos-latest
            generator: ZIP
            artifact: macos
          - os: windows-latest
            generator: ZIP
            artifact: windows

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libaudio-dev \
            libfribidi-dev \
            libjack-dev \
            libsndio-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxss-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libdrm-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libdbus-1-dev \
            libibus-1.0-dev \
            libudev-dev \
            libthai-dev \
            libusb-1.0-0-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libdecor-0-dev \
            liburing-dev
          git clone --depth 1 --branch release-3.4.16 https://github.com/libsdl-org/SDL.git sdl3
          cmake -S sdl3 -B sdl3/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF
          cmake --build sdl3/build --parallel 2
          sudo cmake --install sdl3/build

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install sdl3 ninja

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install sdl3:x64-windows

      - name: Configure
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCHIP_8_VERSION="$VERSION" \
            -DCPACK_GENERATOR="${{ matrix.generator }}" \
            ${{ runner.os == 'Windows' && '-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake' || '' }}

      - name: Build package
        run: cmake --build build --target package --parallel 2

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.artifact }}
          path: build/CHIP_8-*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" dist/CHIP_8-* \
            --repo "$GITHUB_REPOSITORY" \
            --title "CHIP-8 $VERSION" \
            --generate-notes
